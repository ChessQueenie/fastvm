# Optional Ubuntu MATE distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.ubuntu-mate.yml up -d --build
services:
  fastvm:
    image: fastvm:ubuntu-mate
    container_name: ${FASTVM_NAME:-FastVM-UbuntuMATE}
    build:
      args:
        FASTVM_DE: mate
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: ubuntu-mate
