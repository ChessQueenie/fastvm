# Optional NixOS distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.nixos.yml up -d --build
services:
  fastvm:
    image: fastvm:nixos
    container_name: ${FASTVM_NAME:-FastVM-NixOS}
    build:
      args:
        FASTVM_DE: nixos
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: nixos
