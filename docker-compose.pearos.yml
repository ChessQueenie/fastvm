# Optional pearOS distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.pearos.yml up -d --build
services:
  fastvm:
    image: fastvm:pearos
    container_name: ${FASTVM_NAME:-FastVM-pearOS}
    build:
      args:
        FASTVM_DE: pearos
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: pearos
