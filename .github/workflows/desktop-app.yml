name: Desktop App

on:
  push:
    branches: ["**"]
    paths:
      - "desktop-app/**"
      - "scripts/verify-catalog.js"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "desktop-app/**"
      - "scripts/verify-catalog.js"
      - ".github/workflows/desktop-app.yml"

jobs:
  test:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/main/catalog.js
          node --check src/main/docker.js
          node --check src/main/config.js
          node --check src/renderer/renderer.js

      - name: Verify catalog matches the build matrix
        run: node ../scripts/verify-catalog.js

      - name: Unit tests
        run: npm test
