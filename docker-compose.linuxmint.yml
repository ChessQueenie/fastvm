# Optional Linux Mint distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.linuxmint.yml up -d --build
services:
  fastvm:
    image: fastvm:linuxmint
    container_name: ${FASTVM_NAME:-FastVM-LinuxMint}
    build:
      args:
        FASTVM_DE: cinnamon
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: linuxmint
