# Optional Parrot Security OS distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.parrot.yml up -d --build
services:
  fastvm:
    image: fastvm:parrot
    container_name: ${FASTVM_NAME:-FastVM-Parrot}
    build:
      args:
        FASTVM_DE: mate
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: parrot
