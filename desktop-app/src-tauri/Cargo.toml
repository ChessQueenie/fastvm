[package]
name = "fastvm-desktop"
version = "0.1.0"
edition = "2021"
description = "FastVM marketplace - one-click streamed Linux desktops"
license = "MIT"

[lib]
name = "fastvm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
