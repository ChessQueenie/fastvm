<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>FastVM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <span>FastVM</span>
      <span class="muted" id="variant-count"></span>
    </div>
    <div class="status" id="docker-status">Checking Docker…</div>
  </header>

  <main class="layout">
    <section class="panel launcher">
      <h2>Launch a desktop</h2>
      <label class="field">
        <span>Image type</span>
        <select id="kind">
          <option value="desktop">Desktop + preset</option>
          <option value="flavor">Distro flavor</option>
          <option value="single">Single app</option>
        </select>
      </label>

      <label class="field" id="desktop-field">
        <span>Desktop</span>
        <select id="desktop"></select>
      </label>

      <label class="field" id="preset-field">
        <span>Preset</span>
        <select id="preset"></select>
      </label>

      <label class="field hidden" id="flavor-field">
        <span>Flavor</span>
        <select id="flavor"></select>
      </label>

      <label class="field hidden" id="single-field">
        <span>App</span>
        <select id="single"></select>
      </label>

      <div class="grid2">
        <label class="field"><span>Desktop port</span><input id="host-port" type="number" value="3000" min="1" /></label>
        <label class="field"><span>Dashboard port</span><input id="dash-port" type="number" value="3001" min="0" /></label>
      </div>

      <div class="grid2">
        <label class="field"><span>Container name</span><input id="name" type="text" placeholder="FastVM" /></label>
        <label class="field"><span>Shared memory</span><input id="shm" type="text" value="4gb" /></label>
      </div>

      <label class="checkbox"><input id="gpu" type="checkbox" /> GPU passthrough (/dev/dri)</label>

      <div class="preview" id="preview"></div>
      <button class="primary" id="launch">Launch</button>
      <p class="result" id="launch-result"></p>
    </section>

    <section class="panel instances">
      <div class="instances-head">
        <h2>Running containers</h2>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <div id="instances" class="instances-list"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modal-title">Logs</span>
        <button class="ghost" id="modal-close">Close</button>
      </div>
      <pre id="modal-body"></pre>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
