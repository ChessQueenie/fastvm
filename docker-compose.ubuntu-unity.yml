# Optional Ubuntu Unity distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.ubuntu-unity.yml up -d --build
services:
  fastvm:
    image: fastvm:ubuntu-unity
    container_name: ${FASTVM_NAME:-FastVM-UbuntuUnity}
    build:
      args:
        FASTVM_DE: unity
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: ubuntu-unity
