# Optional Pop!_OS distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.pop-os.yml up -d --build
services:
  fastvm:
    image: fastvm:pop-os
    container_name: ${FASTVM_NAME:-FastVM-PopOS}
    build:
      args:
        FASTVM_DE: pop-os
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: pop-os
