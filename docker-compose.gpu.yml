# FastVM GPU overlay (Intel / AMD via VA-API).
# Maps the DRM render nodes into the container so ffmpeg can use VA-API/QSV
# hardware encode and apps can reach the GPU. Use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# For NVIDIA, layer docker-compose.gpu-nvidia.yml on top (requires the NVIDIA
# Container Toolkit on the host). Do not set FASTVM_PRIVILEGED for GPU access.
services:
  fastvm:
    devices:
      - /dev/dri:/dev/dri
    environment:
      - FASTVM_RECORDING_ENCODER=${FASTVM_RECORDING_ENCODER:-auto}
      - FASTVM_ENABLE_GPU_DRIVERS=${FASTVM_ENABLE_GPU_DRIVERS:-true}
      # Opt in to GPU-rasterized desktop sessions (KasmVNC DRI3 + per-session
      # userspace env). Disables the compositor on XFCE/KDE/MATE; see docs/gpu.md.
      - FASTVM_GPU_HW=${FASTVM_GPU_HW:-true}
      - FASTVM_GPU_KEEP_COMPOSITING=${FASTVM_GPU_KEEP_COMPOSITING:-false}
      # Pick a specific DRM render node on multi-GPU hosts (default renderD128).
      - DRINODE=${DRINODE:-/dev/dri/renderD128}
    group_add:
      - video
      - render
