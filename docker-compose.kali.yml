# Optional Kali Linux distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.kali.yml up -d --build
services:
  fastvm:
    image: fastvm:kali
    container_name: ${FASTVM_NAME:-FastVM-Kali}
    build:
      args:
        FASTVM_DE: xfce4
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: kali
