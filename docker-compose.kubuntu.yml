# Optional Kubuntu distro-flavor image. Existing docker-compose.yml is unchanged.
# docker compose -f docker-compose.yml -f docker-compose.kubuntu.yml up -d --build
services:
  fastvm:
    image: fastvm:kubuntu
    container_name: ${FASTVM_NAME:-FastVM-Kubuntu}
    build:
      args:
        FASTVM_DE: kde
        FASTVM_PRESET: development
        FASTVM_OS_FLAVOR: kubuntu
